# Engine settings stay at the extension's defaults (history full, schema update, UUID ids - same as the Spring Boot starter);
# only the database points to Kafgres.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://kafgres:5432/postgres
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.devservices.enabled=false
# The REST resources live in a jar without a Jandex index; RESTEasy only sees indexed classes.
quarkus.index-dependency.rest.group-id=org.cibseven.bpm
quarkus.index-dependency.rest.artifact-id=cibseven-engine-rest-core-jakarta
# Indexing turns every @Path class of the jar into a CDI bean; the sub-resources (created with `new` by the two root
# resources) have constructors CDI cannot satisfy.
quarkus.arc.exclude-types=org.cibseven.bpm.engine.rest.impl.**
