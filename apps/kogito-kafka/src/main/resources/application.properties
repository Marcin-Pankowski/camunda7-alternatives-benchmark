# Process state in Kafka: the addon writes every instance to topic kogito.process and reads it back via Kafka Streams.
# Kafgres speaks the Kafka protocol; the topic is created by the init container in k8s/kogito-*-kafka.
kafka.bootstrap.servers=kafgres:9092
# Kafka Streams has its own setting (default localhost:9012), it does not read kafka.bootstrap.servers.
quarkus.kafka-streams.bootstrap-servers=kafgres:9092
quarkus.kafka-streams.application-id=kogito-scenario-a
quarkus.kafka-streams.topics=kogito.process
quarkus.devservices.enabled=false

# Process events go to Kafka (channels kogito-processinstances-events etc., topic = channel name); the topics are
# created by the init container. Messaging uses kafka.bootstrap.servers above.
# Kafka client defaults instead of SmallRye's acks=1 / no idempotence (same as Kogito Spring Boot). With acks=1 Kafgres
# sometimes never answers a produce request under load; the producer then retries forever and HTTP requests hang.
kafka.acks=all
kafka.enable.idempotence=true
# Wait until Kafka acknowledged each process event (blocking emitter). Default is fire-and-forget: under load the
# unsent events pile up in the heap without limit until the JVM is stuck in full GCs. Like the C7 engines and Flowable,
# which write their history synchronously before answering.
kogito.events.processinstances.errors.propagate=true
