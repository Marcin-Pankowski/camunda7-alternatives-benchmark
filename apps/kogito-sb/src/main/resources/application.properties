# Everything else stays at Kogito/Spring Boot defaults (same persistence as the Quarkus variant).
spring.datasource.url=jdbc:postgresql://kafgres:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
kogito.persistence.type=jdbc
# creates the Kogito tables on startup
kie.flyway.enabled=true
# Spring Boot's own Flyway auto-configuration would run a second migration on "public" (which holds Kafgres' tables) and fail;
# the Kogito tables are created by kie.flyway above, like in the Quarkus variant.
spring.flyway.enabled=false
# Process events (kie-addons-springboot-events-process-kafka) go to Kafka topics in Kafgres; created by the init container.
spring.kafka.bootstrap-servers=kafgres:9092
