# Everything else stays at Kogito/Quarkus defaults.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://kafgres:5432/postgres
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.devservices.enabled=false
# Kogito tables are created by Quarkus' own Flyway (JVM and native alike): kie.flyway scans the classpath at runtime,
# which Quarkus disables in native images ("Scanner is never used in Quarkus").
kie.flyway.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:kie-flyway/db/persistence-jdbc/postgresql
# "public" already holds Kafgres' own tables
quarkus.flyway.baseline-on-migrate=true

# Process events go to Kafka topics in Kafgres (channel name = topic name, created by the init container).
kafka.bootstrap.servers=kafgres:9092
# Kafka client defaults instead of SmallRye's acks=1 / no idempotence (same as Kogito Spring Boot). With acks=1 Kafgres
# sometimes never answers a produce request under load; the producer then retries forever and HTTP requests hang.
kafka.acks=all
kafka.enable.idempotence=true
# Wait until Kafka acknowledged each process event (blocking emitter). Default is fire-and-forget: under load the
# unsent events pile up in the heap without limit until the JVM is stuck in full GCs. Like the C7 engines and Flowable,
# which write their history synchronously before answering.
kogito.events.processinstances.errors.propagate=true
