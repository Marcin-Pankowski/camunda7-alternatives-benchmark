# Single-node k3s in Docker. Traefik (bundled) is the load balancer in front of the engines.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bench
servers: 1
agents: 0
ports:
  - port: 127.0.0.1:8081:80   # Traefik ingress, reachable from the Mac for manual checks
    nodeFilters: [loadbalancer]
