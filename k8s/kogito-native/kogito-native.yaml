# Kogito 10.2.0 on Quarkus, GraalVM native image (apps/kogito), JDBC persistence in Kafgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kogito-native
spec:
  replicas: 1
  selector:
    matchLabels: {app: kogito-native}
  template:
    metadata:
      labels: {app: kogito-native}
    spec:
      initContainers:   # Kafgres starts empty: create the Kafka topics Kogito writes to (process events)
        - name: create-topics
          image: kafgres-postgres:0.3.1
          imagePullPolicy: Never
          env: [{name: PGPASSWORD, value: postgres}]
          # wait until Postgres accepts TCP connections; creating an existing topic fails, which is fine on scale-out
          command: [sh, -c, "until psql -h kafgres -U postgres -tAc 'SELECT 1' >/dev/null 2>&1; do sleep 1; done; for t in kogito-processinstances-events:4 kogito-processdefinitions-events:1 kogito-usertaskinstances-events:1; do psql -h kafgres -U postgres -tAc \"SELECT kafgres_create_topic('${t%:*}', ${t#*:})\" >/dev/null 2>&1 || echo \"topic ${t%:*} already exists\"; done"]
      containers:
        - name: kogito-native
          image: bench-kogito-native:1.0.0
          imagePullPolicy: Never   # built locally (apps/), imported with `k3d image import`
          envFrom: [{configMapRef: {name: history, optional: true}}]   # history switches, written by scenario-a.sh --history
          ports: [{containerPort: 8080}]
          resources:   # identical for every engine: 1 CPU / 2 GB per replica
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            periodSeconds: 1
            failureThreshold: 600
---
apiVersion: v1
kind: Service
metadata:
  name: kogito-native
spec:
  selector: {app: kogito-native}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kogito-native
spec:
  rules:
    - host: kogito-native.bench.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: kogito-native, port: {number: 80}}
