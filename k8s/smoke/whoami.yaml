# Stand-in backend behind the ingress, only for the smoke test (no engine deployed yet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 2   # two pods, so the smoke test also shows the load balancer spreading requests
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector: {app: whoami}
  ports: [{port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
spec:
  rules:
    - host: whoami.bench.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: whoami, port: {number: 80}}
